[package]
name = "liquid-ade"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "liquid_ade"
path = "src/lib.rs"

[[bin]]
name = "liquid-ade"
path = "src/main.rs"

[dependencies]
# Web Server & Async Runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
mime_guess = "2.0"

# Asset Embedding (React dist)
rust-embed = "8.0"

# Protocol / Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Embedded Database
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"

[dev-dependencies]
http-body-util = "0.1"

