[package]
name = "liquid-ade"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Web Server & Async Runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }

# Asset Embedding (React dist)
rust-embed = "8.0"

# Protocol / Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Agent Client Protocol (ACP) - Optional placeholder for now
# acp-core = "0.1"
